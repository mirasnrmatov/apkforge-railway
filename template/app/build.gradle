plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // namespace тұрақты — Kotlin файлдардың package жолы өзгермейді
    namespace 'com.apkforge.webview'
    compileSdk 34

    defaultConfig {
        // ↓↓↓ BACKEND ОСЫ ӨРІСТЕРДІ АЛМАСТЫРАДЫ ↓↓↓
        applicationId "__APPLICATION_ID__"   // мыс. com.mysite.app
        versionCode __VERSION_CODE__         // мыс. 1
        versionName "__VERSION_NAME__"       // мыс. "1.0"
        // ↑↑↑ ------------------------------ ↑↑↑

        minSdk 21
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug кілтімен қол қою (демо/тест үшін).
            // Продакшнде backend жеке keystore-мен қол қоюы керек.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    dexOptions {
        javaMaxHeapSize "512m"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
}
