# APKForge — Python скриптінен Windows .exe (PyInstaller --onefile).
# Cloudflare Worker бұл workflow-ды GitHub API арқылы (workflow_dispatch) іске қосады,
# сосын run-ды run-name ішіндегі job_id бойынша тауып, күйін бақылайды.
# Жалғыз .py файл ZIP-сіз келуі мүмкін — «ZIP ашу» қадамы оны өзі танып алады.
# Қадам атауларын өзгертсеңіз, worker.js ішіндегі STEP_HINTS-ті де жаңартыңыз.

name: Build EXE (Python)

run-name: "EXE build ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "APKForge job ID (серверден келеді, мыс. job_1789131361951_a1b2c3_py)"
        required: true
        type: string
      zip_url:
        description: "Python жобасы ZIP файлының public URL-і"
        required: true
        type: string
      app_name:
        description: ".exe атауы (кеңейтусіз)"
        required: true
        default: "MyApp"
        type: string
      entry_point:
        description: "Негізгі скрипт ZIP ішіндегі жолымен (мыс. main.py); бос болса өзі табылады"
        required: false
        default: ""
        type: string
      release_id:
        description: "Worker жасаған draft release ID-і (дайын файл сонда сақталады)"
        required: true
        type: string

# Пайдаланушы коды (requirements.txt пакеттері) runner-де орындалады —
# сондықтан job токеніне ешқандай рұқсат бермейміз, репозиторий де checkout жасалмайды.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    # Input-тар скриптке тек env арқылы беріледі (script injection-нан қорғау)
    env:
      JOB_ID: ${{ inputs.job_id }}
      ZIP_URL: ${{ inputs.zip_url }}
      APP_NAME: ${{ inputs.app_name }}
      ENTRY_POINT: ${{ inputs.entry_point }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Параметрлерді тексеру
        run: |
          echo "::add-mask::$ZIP_URL"
          fail() { echo "::error::$1"; exit 1; }
          [[ "$JOB_ID" =~ ^job_[A-Za-z0-9_]+$ ]]  || fail "job_id форматы қате"
          [[ "$ZIP_URL" =~ ^https?:// ]]          || fail "zip_url http(s) болуы керек"
          # entry point: ZIP ішіндегі салыстырмалы жол, .py-мен аяқталады, '..' жоқ
          [[ -z "$ENTRY_POINT" || ( "$ENTRY_POINT" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*\.py$ && "$ENTRY_POINT" != *..* ) ]] \
                                                  || fail "Entry point форматы қате (мыс. main.py немесе app/main.py)"
          # .exe атауы: бос емес, 50 таңбаға дейін, Windows тыйым салған таңбаларсыз
          [[ -n "${APP_NAME// }" && ${#APP_NAME} -le 50 ]] || fail "Қосымша атауы бос немесе 50 таңбадан ұзын"
          [[ "$APP_NAME" != *[\<\>:\"/\\\|\?\*]* && "$APP_NAME" != *[[:cntrl:]]* ]] \
                                                  || fail "Қосымша атауында < > : \" / \\ | ? * таңбалары болмауы керек"

      - name: Python 3.11 орнату
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ZIP жүктеу
        run: |
          curl -fsSL --retry 3 --retry-delay 3 --max-time 180 \
            --max-filesize 104857600 -o site.zip "$ZIP_URL"
          ls -l site.zip

      - name: ZIP ашу
        run: |
          rm -rf src && mkdir src
          INNER=""
          if python -c "import sys,zipfile; sys.exit(0 if zipfile.is_zipfile('site.zip') else 1)"; then
            # Python zipfile '..' және абсолют жолдарды өзі тазалайды
            python -m zipfile -e site.zip src || { echo "::error::ZIP файл бұзық"; exit 1; }
            rm -rf src/__MACOSX src/.DS_Store

            # ZIP ішінде бір ғана папка болса — оны жайып жіберу
            shopt -s dotglob nullglob
            items=(src/*)
            if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
              INNER="$(basename "${items[0]}")/"
              mv "${items[0]}" src_inner
              mv src_inner/* src/
              rmdir src_inner
            fi
            shopt -u dotglob
          else
            # ZIP емес — жалғыз .py файл келді (Worker entry point-ті оның атымен жібереді)
            cp site.zip "src/${ENTRY_POINT:-main.py}"
          fi

          ENTRY="$ENTRY_POINT"
          # Пайдаланушы ZIP-тегі толық жолды жазса (мыс. proj/main.py), жайылған папканы алып тастаймыз
          if [ -n "$ENTRY" ] && [ -n "$INNER" ] && [ ! -f "src/$ENTRY" ] && [[ "$ENTRY" == "$INNER"* ]]; then
            ENTRY="${ENTRY#"$INNER"}"
          fi
          # Entry point көрсетілмесе — әдеттегі атаулар, болмаса түбірдегі жалғыз .py
          if [ -z "$ENTRY" ]; then
            for n in main.py __main__.py app.py; do [ -f "src/$n" ] && { ENTRY="$n"; break; }; done
          fi
          if [ -z "$ENTRY" ]; then
            shopt -s nullglob
            root=(src/*.py)
            [ ${#root[@]} -eq 1 ] && ENTRY="$(basename "${root[0]}")"
          fi
          [ -n "$ENTRY" ] || { echo "::error::Entry point көрсетіңіз (мыс. main.py)"; exit 1; }
          [[ "$ENTRY" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*\.py$ && "$ENTRY" != *..* ]] \
            || { echo "::error::$ENTRY атауы латын әріптерімен болуы керек"; exit 1; }
          [ -f "src/$ENTRY" ] || { echo "::error::ZIP ішінде $ENTRY табылмады"; exit 1; }
          echo "ENTRY=$ENTRY" >> "$GITHUB_ENV"
          echo "Entry point: $ENTRY"
          echo "Python файлдары:"; (cd src && find . -name '*.py' | head -50)

      - name: Тәуелділіктерді орнату (requirements.txt)
        working-directory: src
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt жоқ — өткізіп жіберілді"
          fi

      - name: PyInstaller орнату
        run: python -m pip install "pyinstaller>=6,<7"

      - name: PyInstaller --onefile
        working-directory: src
        run: |
          python -m PyInstaller --onefile --noconfirm --clean \
            --name "$APP_NAME" "$ENTRY"
          ls -l dist

      - name: EXE-ні сақтау
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: src/dist/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Дайын файлды Worker жасаған draft release-ке қосу.
  # Build job-қа жазу рұқсатын бермеу үшін бөлек job-та жасалады.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Нәтижені алу
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: out

      - name: Release-ге жүктеу
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "::error::release_id қате"; exit 1; }
          f=$(find out -type f -name '*.exe' | head -1)
          [ -n "$f" ] || { echo "::error::.exe файлы табылмады"; exit 1; }
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$f" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=output.exe" > /dev/null
          echo "Сақталды: $(du -h "$f" | cut -f1)"
